<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Family Tree Builder</title>
<style>
  /* Layout concept: generation rows run top to bottom; couples sit side by
     side within a row; an SVG layer behind the cards draws marriage lines
     and parent-to-children connectors computed from a leaf-based tree layout. */
  :root{
    --bg:#faf8f4;
    --surface:#ffffff;
    --surface-sunken:#f1ede6;
    --ink:#2a2521;
    --ink-muted:#766f66;
    --ink-faint:#a39a8d;
    --accent:#44695a;
    --accent-ink:#1f3a2f;
    --accent-soft:#e3ebe4;
    --line:#d9d1c4;
    --line-strong:#b9ae9c;
    --danger:#a8462f;
    --danger-soft:#f3e2dc;
    --trace:#b45309;
    --shadow: 0 1px 2px rgba(40,32,20,.06), 0 6px 18px rgba(40,32,20,.07);
    --radius: 10px;
    --font-display: 'Fraunces', Georgia, 'Times New Roman', serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1a1815; --surface:#232019; --surface-sunken:#1f1c17;
      --ink:#ede7dc; --ink-muted:#aea496; --ink-faint:#7c7367;
      --accent:#86b49a; --accent-ink:#dceade; --accent-soft:#2a3630;
      --line:#3c362c; --line-strong:#554d3e;
      --danger:#d98063; --danger-soft:#3a251e;
      --trace:#fb923c;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 24px rgba(0,0,0,.35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1a1815; --surface:#232019; --surface-sunken:#1f1c17;
    --ink:#ede7dc; --ink-muted:#aea496; --ink-faint:#7c7367;
    --accent:#86b49a; --accent-ink:#dceade; --accent-soft:#2a3630;
    --line:#3c362c; --line-strong:#554d3e;
    --danger:#d98063; --danger-soft:#3a251e;
    --trace:#fb923c;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--font-body); font-size:14px; line-height:1.45;
    padding-left:max(16px, env(safe-area-inset-left,0px));
    padding-right:max(16px, env(safe-area-inset-right,0px));
    display:flex; flex-direction:column; height:100%;
  }
  h1,h2,h3{font-family:var(--font-display); font-weight:600; margin:0; text-wrap:balance;}
  button{font-family:var(--font-body); cursor:pointer;}
  input,select,textarea{font-family:var(--font-body); font-size:14px; color:var(--ink);}
  ::selection{background:var(--accent-soft);}

  /* ---------- Top bar ---------- */
  .topbar{
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    padding:14px 0 12px; border-bottom:1px solid var(--line);
    flex:0 0 auto;
  }
  .brand{display:flex; align-items:baseline; gap:8px; margin-right:auto;}
  .brand h1{font-size:19px; letter-spacing:.2px;}
  .brand .count{font-size:12px; color:var(--ink-muted);}
  .seg{
    display:flex; border:1px solid var(--line-strong); border-radius:8px; overflow:hidden;
  }
  .seg button{
    background:var(--surface); border:none; color:var(--ink-muted); font-size:12.5px;
    padding:7px 12px; font-weight:600; letter-spacing:.2px;
  }
  .seg button + button{border-left:1px solid var(--line-strong);}
  .seg button[aria-pressed="true"]{background:var(--accent); color:#fff;}
  .btn{
    background:var(--surface); border:1px solid var(--line-strong); color:var(--ink);
    border-radius:8px; padding:7px 13px; font-size:12.5px; font-weight:600;
    display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
  }
  .btn:hover{border-color:var(--accent);}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  .btn.primary:hover{filter:brightness(1.06);}
  .btn.ghost{border-color:transparent; background:transparent;}
  .btn.danger{color:var(--danger); border-color:var(--danger);}
  .btn.danger:hover{background:var(--danger-soft);}
  .btn.admin-unlocked{border-color:var(--accent); color:var(--accent-ink); background:var(--accent-soft);}
  .btn:focus-visible, .seg button:focus-visible, .card:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }
  .icon{width:14px; height:14px; flex:none;}

  .search-wrap{position:relative; display:flex; align-items:center;}
  .search-wrap .icon{position:absolute; left:9px; color:var(--ink-faint); pointer-events:none;}
  #searchInput{
    padding:7px 10px 7px 28px; border:1px solid var(--line-strong); border-radius:8px;
    background:var(--surface); width:180px;
  }

  .banner{
    flex:0 0 auto; background:var(--accent-soft); color:var(--accent-ink);
    font-size:12.5px; padding:8px 0; display:flex; align-items:center; gap:10px; justify-content:center;
    border-bottom:1px solid var(--line);
  }
  .banner button{background:none;border:none;color:var(--accent-ink); font-weight:700; text-decoration:underline; font-size:12.5px; padding:0;}

  .trace-panel{
    flex:0 0 auto; background:var(--surface-sunken); border-bottom:1px solid var(--line);
    padding:10px 0; display:flex; flex-direction:column; gap:8px;
  }
  .trace-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .trace-row input{
    border:1px solid var(--line-strong); border-radius:8px; padding:7px 10px; background:var(--surface); color:var(--ink);
    font-size:12.5px; width:190px; min-width:0;
  }
  .trace-arrow{color:var(--ink-faint); font-size:14px;}
  .trace-result{font-size:12.5px; color:var(--ink-muted); line-height:1.6;}
  .person-card.trace-endpoint{border-color:var(--trace); box-shadow:0 0 0 2px var(--trace), var(--shadow);}

  /* ---------- Tree canvas ---------- */
  #treeScroll{
    flex:1 1 auto; overflow:auto; position:relative; background:
      radial-gradient(var(--line) 1px, transparent 1px) 0 0/22px 22px;
    background-color: var(--surface-sunken);
    cursor: grab;
  }
  #treeScroll.panning{ cursor: grabbing; }
  #treeCanvas{position:relative;}
  #treeSvg{position:absolute; top:0; left:0; pointer-events:none;}
  .person-card{
    position:absolute; width:168px; background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius); box-shadow:var(--shadow); padding:10px 10px 9px;
    display:flex; gap:9px; align-items:flex-start;
    transition:border-color .12s, transform .12s;
  }
  .person-card:hover{border-color:var(--accent); transform:translateY(-1px);}
  .person-card{cursor:grab;}
  .person-card:active{cursor:grabbing;}
  .person-card .textwrap{min-width:0; flex:1;}
  .avatar{
    width:40px; height:40px; border-radius:50%; flex:none; position:relative;
    background-size:cover; background-position:center; background-color:var(--accent-soft);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-weight:600; font-size:14px; color:var(--accent-ink);
    border:1px solid var(--line); overflow:hidden; cursor:pointer;
  }
  .avatar input{position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%;}
  .avatar .cambadge{
    position:absolute; bottom:-2px; right:-2px; width:15px; height:15px; border-radius:50%;
    background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center;
    border:1.5px solid var(--surface); pointer-events:none;
  }
  .avatar .cambadge svg{width:8px;height:8px;}
  .p-name{font-family:var(--font-display); font-weight:600; font-size:13.5px; line-height:1.25;
    overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;}
  .p-maiden{color:var(--ink-muted); font-weight:400; font-size:12px;}
  .p-dates{font-size:11.5px; color:var(--ink-muted); margin-top:2px; font-variant-numeric:tabular-nums;}
  .p-details{font-size:11px; color:var(--ink-faint); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .p-btn{all:unset; cursor:pointer; display:block; width:100%;}

  .unit-plus{
    position:absolute; width:22px; height:22px; border-radius:50%; background:var(--surface);
    border:1px dashed var(--line-strong); color:var(--ink-faint); display:flex; align-items:center;
    justify-content:center; font-size:14px; line-height:1; pointer-events:auto;
  }
  .unit-plus:hover{border-color:var(--accent); color:var(--accent); border-style:solid;}

  .unit-collapse{
    position:absolute; height:22px; min-width:22px; padding:0 7px; border-radius:11px; background:var(--surface);
    border:1px solid var(--line-strong); color:var(--ink-faint); display:flex; align-items:center;
    justify-content:center; font-size:11.5px; font-weight:600; line-height:1; pointer-events:auto; white-space:nowrap;
  }
  .unit-collapse:hover{border-color:var(--accent); color:var(--accent);}
  .unit-collapse.is-collapsed{background:var(--accent-soft); border-color:var(--accent); color:var(--accent-ink);}

  .empty-state{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px; text-align:center; padding:20px;
  }
  .empty-state h2{font-size:20px;}
  .empty-state p{color:var(--ink-muted); max-width:340px; margin:0;}

  /* ---------- List view ---------- */
  #listView{flex:1 1 auto; overflow:auto; display:none; padding:4px 0 24px;}
  table.ppl{width:100%; border-collapse:collapse; font-size:13px;}
  table.ppl th{
    text-align:left; font-size:11px; letter-spacing:.4px; text-transform:uppercase; color:var(--ink-faint);
    padding:8px 10px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg);
  }
  table.ppl td{padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:middle;}
  table.ppl tr{cursor:pointer;}
  table.ppl tr:hover td{background:var(--accent-soft);}
  .row-avatar{width:30px; height:30px; border-radius:50%; background-size:cover; background-position:center;
    background-color:var(--accent-soft); display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-weight:600; font-size:11px; color:var(--accent-ink); overflow:hidden; border:1px solid var(--line);}
  .muted{color:var(--ink-muted);}

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(20,16,10,.42); display:flex; align-items:flex-end;
    justify-content:center; z-index:50; padding:0;
  }
  @media (min-width:640px){ .overlay{align-items:center; padding:20px;} }
  .modal{
    background:var(--surface); width:100%; max-width:440px; max-height:92vh; overflow:auto;
    border-radius:16px 16px 0 0; box-shadow:0 -4px 30px rgba(0,0,0,.2);
    padding-bottom:max(18px, env(safe-area-inset-bottom,0px));
  }
  @media (min-width:640px){ .modal{border-radius:14px; box-shadow:var(--shadow);} }
  .modal-head{
    display:flex; align-items:center; gap:10px; padding:16px 18px 10px; position:sticky; top:0;
    background:var(--surface); z-index:2; border-bottom:1px solid var(--line);
  }
  .modal-head h2{font-size:17px; flex:1;}
  .modal-close{all:unset; cursor:pointer; color:var(--ink-muted); padding:4px;}
  .modal-body{padding:16px 18px 6px; display:flex; flex-direction:column; gap:14px;}
  .field{display:flex; flex-direction:column; gap:5px;}
  .field label{font-size:11.5px; font-weight:600; color:var(--ink-muted); letter-spacing:.2px;}
  .field input, .field select, .field textarea{
    border:1px solid var(--line-strong); border-radius:8px; padding:8px 10px; background:var(--surface); color:var(--ink);
    width:100%;
  }
  .field textarea{resize:vertical; min-height:56px;}
  .field-row{display:flex; gap:10px;}
  .field-row .field{flex:1; min-width:0;}
  .modal-avatar-row{display:flex; align-items:center; gap:14px;}
  .modal-avatar{width:68px; height:68px; border-radius:50%; background-size:cover; background-position:center;
    background-color:var(--accent-soft); display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-weight:600; font-size:22px; color:var(--accent-ink); flex:none; border:1px solid var(--line); overflow:hidden;}
  .relbtns{display:flex; flex-wrap:wrap; gap:8px;}
  .relbtns .btn{font-size:12px; padding:6px 10px;}
  .modal-foot{
    display:flex; gap:10px; padding:14px 18px 4px; border-top:1px solid var(--line); margin-top:6px; flex-wrap:wrap;
  }
  .confirm-del{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--danger); flex-wrap:wrap;}

  .toast{
    position:fixed; left:50%; bottom:max(18px, env(safe-area-inset-bottom,0px)); transform:translateX(-50%);
    background:var(--ink); color:var(--bg); font-size:12.5px; padding:9px 16px; border-radius:20px;
    z-index:80; box-shadow:var(--shadow); opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-4px);}

  .zoomctl{
    position:fixed; right:max(16px, env(safe-area-inset-right,0px)); bottom:18px; display:flex; flex-direction:column;
    gap:1px; background:var(--surface); border:1px solid var(--line-strong); border-radius:10px; box-shadow:var(--shadow); overflow:hidden; z-index:30;
  }
  .zoomctl button{all:unset; cursor:pointer; width:34px; height:34px; display:flex; align-items:center; justify-content:center;
    color:var(--ink-muted); font-size:16px;}
  .zoomctl button:hover{background:var(--accent-soft); color:var(--accent-ink);}
  .zoomctl button + button{border-top:1px solid var(--line);}

  #importOverlay .field textarea{min-height:140px; font-family:ui-monospace,monospace; font-size:11.5px;}
  [hidden]{display:none!important;}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap">
</head>
<body>



<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<div class="topbar">
  <div class="brand">
    <h1>Family Tree Builder</h1>
    <span class="count" id="peopleCount"></span>
    <span class="count" id="syncStatus" style="margin-left:6px;"></span>
  </div>
  <div class="search-wrap" id="searchWrap">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input id="searchInput" placeholder="Search people…" autocomplete="off">
  </div>
  <div class="seg" role="tablist" aria-label="View">
    <button id="tabTree" aria-pressed="true">Tree</button>
    <button id="tabList" aria-pressed="false">List</button>
  </div>
  <button class="btn" id="traceBtn" title="Trace how two people connect">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h4l2.5 7L13 5l2.5 7H21"/></svg>
    Trace
  </button>
  <button class="btn primary" id="addPersonBtn">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>
    Add person
  </button>
  <button class="btn ghost" id="adminBtn" title="Admin mode (needed to delete people)">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
    <span id="adminLabel">Admin</span>
  </button>
  <button class="btn ghost" id="moreBtn" title="More">
    <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
  </button>
</div>

<datalist id="personNameOptions"></datalist>

<div class="trace-panel" id="tracePanel" hidden>
  <div class="trace-row">
    <input type="text" id="traceA" list="personNameOptions" placeholder="First person…" autocomplete="off">
    <span class="trace-arrow">↔</span>
    <input type="text" id="traceB" list="personNameOptions" placeholder="Second person…" autocomplete="off">
    <button class="btn primary" id="traceFindBtn">Find connection</button>
    <button class="btn ghost" id="traceClearBtn">Clear</button>
  </div>
  <div class="trace-result" id="traceResult" hidden></div>
</div>

<div class="banner" id="exampleBanner" hidden>
  Showing an example family so you can see how branches connect.
  <button id="startOwnBtn">Clear it and start your own tree →</button>
</div>

<div id="treeScroll">
  <div id="treeCanvas">
    <svg id="treeSvg"></svg>
  </div>
  <div class="empty-state" id="emptyState" hidden>
    <h2>Your tree is empty</h2>
    <p>Add the first person, then branch out — add their parents, a partner, or children straight from each card.</p>
    <button class="btn primary" id="emptyAddBtn">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>
      Add the first person
    </button>
  </div>
  <div class="zoomctl">
    <button id="zoomIn" title="Zoom in">+</button>
    <button id="zoomReset" title="Reset zoom" style="font-size:11px;">100%</button>
    <button id="zoomOut" title="Zoom out">–</button>
    <button id="centerTree" title="Center tree / jump to top" style="font-size:15px;">⌖</button>
  </div>
</div>

<div id="listView">
  <table class="ppl" id="pplTable">
    <thead><tr><th></th><th>Name</th><th>Born</th><th>Died</th><th>Age</th><th>Parents</th><th>Partner</th><th>Children</th><th>Phone</th><th>Email</th><th>Location</th></tr></thead>
    <tbody id="pplTbody"></tbody>
  </table>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

/* ================= Constants ================= */
var CARD_W = 168, CARD_H = 70, SPOUSE_GAP = 10, COL_W = 206, ROW_H = 168, PAD = 80;
// a bright, maximally-distinct spectrum for separate branches (used first); once exhausted,
// a second, more muted set extends it further so very large trees still get unique colors.

// (lastSyncedJson), and (2) never let an incoming update WHOLESALE-REPLACE local "people" --
// always patch in just what changed, and never wipe to {} first, even on the very first
// delivery after connecting (which can land after the person has already added someone
// locally while the connection was still being made).
var lastSyncedJson = {};

// resurrecting a person while their delete is still being retried against the server; see

// Retries a failed delete a few times with backoff before giving up and telling the user --
// entirely in memory, nothing written to any local storage. This is the one place the app
// still tries to paper over a brief connection blip, since without it a single transient
// failure would otherwise leave the row stranded on the server, to be pulled back down and
// "un-deleted" on the next fetch.
function deleteFromBackend(id, attempt){
  attempt = attempt || 1;
  deletesInFlight[id] = true;
  var call = dbApi
    ? dbApi.collection("people").doc(id).delete().then(function(){ return true; }, function(){ return false; })
    : supaClient.from("family_tree_people").delete().eq("id", id).then(function(res){ return !(res && res.error); }, function(){ return false; });
  call.then(function(ok){
    if(ok){ delete deletesInFlight[id]; return; }
    if(attempt < 4){
      setTimeout(function(){ deleteFromBackend(id, attempt + 1); }, attempt * 700);
    } else {
      delete deletesInFlight[id];

    }
  });
}
function syncToDb(){

  var changedIds = [];
  Object.keys(people).forEach(function(id){
    var json = JSON.stringify(people[id]);
    if(lastSyncedJson[id] !== json){ changedIds.push(id); lastSyncedJson[id] = json; }
  });

  if(exampleChanged) lastSyncedIsExample = isExample;

    changedIds.forEach(function(id){

    });

      dbApi.doc("meta/info").set({ isExample: isExample }).catch(function(){ lastSyncedIsExample = null; });
    }
  }

    changedIds.forEach(function(id){
      supaClient.from("family_tree_people").upsert({ id: id, data: people[id] }).then(function(res){
        if(res && res.error) delete lastSyncedJson[id];
      }, function(){ delete lastSyncedJson[id]; });

    // ignore it rather than resurrecting them.
    return;

/* ================= Helpers ================= */
function fullName(person){
  return [person.firstName, person.lastName].filter(Boolean).join(" ") || "Unnamed";
}
function normName(first, last){
  return ((first||"") + " " + (last||"")).toLowerCase().replace(/\s+/g, " ").trim();
}
function levenshtein(a, b){
  a = a || ""; b = b || "";
  var m = a.length, n = b.length;
  if(m === 0) return n;
  if(n === 0) return m;
  var prev = new Array(n+1), cur = new Array(n+1);
  for(var j=0;j<=n;j++) prev[j] = j;
  for(var i=1;i<=m;i++){
    cur[0] = i;
    for(var k=1;k<=n;k++){
      var cost = a[i-1] === b[k-1] ? 0 : 1;
      cur[k] = Math.min(prev[k]+1, cur[k-1]+1, prev[k-1]+cost);
    }
    var tmp = prev; prev = cur; cur = tmp;
  }
  return prev[n];
}
function sameIdSet(a, b){
  if(a.length !== b.length) return false;
  var sa = a.slice().sort(), sb = b.slice().sort();
  for(var i=0;i<sa.length;i++){ if(sa[i] !== sb[i]) return false; }
  return true;
}
// Finds people already in the tree whose name closely matches the one being typed,
// so a parent/sibling/etc. typed a second time (for a different child) can be linked
// to the SAME existing person instead of silently creating a look-alike duplicate.
function findNameMatches(firstName, lastName, excludeIds){
  var q = normName(firstName, lastName);
  if(q.length < 3) return [];
  excludeIds = excludeIds || [];
  var out = [];
  Object.keys(people).forEach(function(id){
    if(excludeIds.indexOf(id) !== -1) return;
    var p = people[id];
    var name = normName(p.firstName, p.lastName);
    if(!name) return;
    var dist = levenshtein(q, name);
    var threshold = name.length <= 6 ? 1 : 2; // tighter tolerance for short names
    if(dist <= threshold){
      out.push({ id: id, person: p, dist: dist });
    }
  });
  out.sort(function(a,b){ return a.dist - b.dist; });
  return out.slice(0, 4);
}
function lifespan(person){
  var b = person.birthYear, d = person.deathYear;
  if(!b && !d) return "";
  if(b && d) return b + "–" + d;
  if(b && !d) return "b. " + b;
  return "d. " + d;
}
function ageInfo(person){
  var b = parseInt(person.birthYear, 10), d = parseInt(person.deathYear, 10);
  if(isNaN(b)) return "";
  if(!isNaN(d)) return (d - b) + " at death";
  var curYear = new Date().getFullYear();
  return (curYear - b) + " yrs";
}
function displayDates(person){
  var ls = lifespan(person);
  if(!ls) return "";
  var age = ageInfo(person);
  return age ? (ls + "  ·  " + age) : ls;
}
function initials(person){
  var a = (person.firstName||"").trim()[0] || "";
  var b = (person.lastName||"").trim()[0] || "";

}
var AVATAR_HUES = [150,205,25,280,340,60,190];
function avatarColor(id){

/* ================= Relationship tracing ================= */
function refreshNameOptions(){

  dl.innerHTML = Object.keys(people).map(function(id){

function resolvePersonByText(text){
  text = (text||"").trim().toLowerCase();
  if(!text) return null;
  var ids = Object.keys(people), i;
  for(i=0;i<ids.length;i++){
    var p = people[ids[i]];
    var label = (fullName(p) + (lifespan(p) ? " (" + lifespan(p) + ")" : "")).toLowerCase();
    if(label === text) return p.id;
  }
  for(i=0;i<ids.length;i++){
    if(fullName(people[ids[i]]).toLowerCase() === text) return ids[i];
  }

}
function buildAdjacency(){
  var adj = {};
  function link(a,b){ if(!a || !b) return; (adj[a]=adj[a]||[]).push(b); (adj[b]=adj[b]||[]).push(a); }
  Object.keys(people).forEach(function(id){
    var p = people[id];
    if(p.partnerId && people[p.partnerId]) link(id, p.partnerId);
    (p.parentIds||[]).forEach(function(pid){ if(people[pid]) link(id, pid); });
  });
  return adj;
}
function findPath(aId, bId){
  if(aId === bId) return [aId];
  var adj = buildAdjacency();
  var queue = [aId];
  var prev = {}; prev[aId] = null;
  var visited = {}; visited[aId] = true;
  while(queue.length){
    var cur = queue.shift();
    if(cur === bId) break;
    (adj[cur]||[]).forEach(function(n){
      if(!visited[n]){ visited[n]=true; prev[n]=cur; queue.push(n); }
    });
  }
  if(!visited[bId]) return null;
  var path = [bId], node = bId;
  while(prev[node] !== null && prev[node] !== undefined){
    node = prev[node];
    path.push(node);
  }
  path.reverse();
  return path;
}
// how `toId` relates to `fromId`: "partner" | "parent" (toId is fromId's parent) | "child" (toId is fromId's child)
function relationLabel(fromId, toId){
  var a = people[fromId], b = people[toId];
  if(a.partnerId === toId) return "partner";
  if((a.parentIds||[]).indexOf(toId) !== -1) return "parent";
  if((b.parentIds||[]).indexOf(fromId) !== -1) return "child";
  return "related";
}
function describePath(path){
  if(!path || path.length < 2) return fullName(people[path[0]]) + " — that's the same person.";
  var parts = [fullName(people[path[0]])];
  for(var i=1;i<path.length;i++){
    var rel = relationLabel(path[i-1], path[i]);
    var word = rel==="partner" ? "partner" : rel==="parent" ? "parent" : rel==="child" ? "child" : "relative";
    parts.push("→ " + word + ": " + fullName(people[path[i]]));
  }
  return parts.join("  ");
}
function escapeHtml(s){
  return String(s||"").replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

/* ================= Tree construction ================= */
function buildChildrenMap(){
  var map = {};
  Object.keys(people).forEach(function(id){
    var person = people[id];
    (person.parentIds||[]).forEach(function(pid){
      if(!people[pid]) return;
      if(!map[pid]) map[pid] = [];
      if(map[pid].indexOf(id) === -1) map[pid].push(id);
    });
  });
  return map;
}
function computeGenerations(){
  var gen = {};

    if(stack.indexOf(id) !== -1) { gen[id] = 0; return 0; } // guard against cycles
    stack.push(id);
    var person = people[id];
    var parentIds = (person.parentIds||[]).filter(function(pid){ return people[pid]; });
    if(parentIds.length === 0){
      gen[id] = 0;
    } else {
      var maxG = -1;
      parentIds.forEach(function(pid){ maxG = Math.max(maxG, genOf(pid, stack)); });
      gen[id] = maxG + 1;
    }
    stack.pop();
    return gen[id];
  }
  Object.keys(people).forEach(function(id){ genOf(id, []); });
  // align partners to the same generation
  Object.keys(people).forEach(function(id){
    var person = people[id];
    if(person.partnerId && people[person.partnerId]){
      var g = Math.max(gen[id], gen[person.partnerId]);
      gen[id] = g; gen[person.partnerId] = g;
    }
  });
  return gen;
}
// Build the unit tree (a unit = one person, or a couple, plus the units of their children)
function buildUnits(childrenMap, gen){
  var visited = {};
  var crossLinks = []; // {parentUnit, childId} -- a child already drawn elsewhere (married in) gets a connector instead of a duplicate card
  // Counts every descendant below a set of starting children, regardless of nested collapse
  // state -- used only for the "N hidden" badge on a collapsed unit, never for layout.
  function countDescendants(startIds){
    var seen = {}, queue = startIds.slice(), count = 0;
    while(queue.length){
      var id = queue.shift();
      if(seen[id]) continue;
      seen[id] = true;
      count++;
      (childrenMap[id]||[]).forEach(function(cid){ queue.push(cid); });
    }
    return count;
  }
  function buildUnit(personId){
    if(visited[personId]) return null;
    visited[personId] = true;
    var person = people[personId];
    var partner = (person.partnerId && people[person.partnerId]) ? people[person.partnerId] : null;
    if(partner) visited[partner.id] = true;
    var members = partner ? [person, partner] : [person];
    var childIds = {};
    (childrenMap[personId]||[]).forEach(function(cid){ childIds[cid]=1; });
    if(partner) (childrenMap[partner.id]||[]).forEach(function(cid){ childIds[cid]=1; });
    var childIdList = Object.keys(childIds);
    var collapsed = !!person.collapsedChildren;
    var unit = { key: personId, members: members, childUnits: [], gen: gen[personId], hasChildren: childIdList.length > 0, collapsed: false, hiddenCount: 0 };
    if(collapsed && childIdList.length){
      unit.collapsed = true;
      unit.hiddenCount = countDescendants(childIdList);
      // Mark every descendant (and their partners) visited, without building units for them,
      // so a collapsed branch truly disappears from the canvas instead of surfacing elsewhere
      // as a stray root or a duplicate card.
      var stack = childIdList.slice();
      while(stack.length){
        var id = stack.pop();
        if(visited[id]) continue;
        visited[id] = true;
        var pp = people[id];
        if(pp && pp.partnerId && people[pp.partnerId]) visited[pp.partnerId] = true;
        (childrenMap[id]||[]).forEach(function(cid){ stack.push(cid); });
      }
    } else {
      childIdList.sort(function(a,b){
        return (parseInt(people[a].birthYear)||9999) - (parseInt(people[b].birthYear)||9999);
      }).forEach(function(cid){
        var u = buildUnit(cid);
        if(u){
          unit.childUnits.push(u);
        } else {
          // cid was already visited elsewhere -- they married into another branch.
          // Keep a reference so we can draw a connector to wherever they actually ended up.
          crossLinks.push({ parentUnit: unit, childId: cid });
        }
      });

  }

    var person = people[id];
    return !(person.parentIds||[]).some(function(pid){ return people[pid]; });
  }).sort(function(a,b){ return (parseInt(people[a].birthYear)||9999) - (parseInt(people[b].birthYear)||9999); });
  var top = [];
  roots.forEach(function(id){
    var u = buildUnit(id);
    if(u) top.push(u);
  });
  return { top: top, crossLinks: crossLinks };
}
function assignX(units){
  // A 2-member (couple) unit renders much wider than a single card -- CARD_W*2+SPOUSE_GAP,
  // versus one COL_W-wide slot for a single person -- so it needs two leaf slots' worth of
  // room, not one, or it overlaps whichever unit sits next to it. Critically, this applies
  // even when the couple HAS children: an only child reserves just one slot on its own, but
  // if its two parents need two, the couple's card pair still has to fit over that one slot
  // and would spill into whoever is next door. So every unit reserves at least its own
  // width (unit._w), bottom-up, as the max of that and its children's combined width; then
  // positions are assigned top-down, centering each unit's children under it (or centering
  // the unit itself over its children, when the children need more room than the unit does).
  // unit.x ends up as the unit's CENTER, in COL_W-sized slot units (centerXOf turns it into
  // a pixel position directly).
  function leafWidth(unit){ return unit.members.length >= 2 ? 2 : 1; }
  function computeWidth(unit){
    if(unit.childUnits.length === 0){
      unit._w = leafWidth(unit);
    } else {
      var childrenTotal = 0;
      unit.childUnits.forEach(function(c){ childrenTotal += computeWidth(c); });
      unit._w = Math.max(leafWidth(unit), childrenTotal);
    }
    return unit._w;
  }
  function place(unit, left){
    unit.x = left + unit._w/2;
    if(unit.childUnits.length){
      var childrenTotal = 0;
      unit.childUnits.forEach(function(c){ childrenTotal += c._w; });
      var childLeft = left + (unit._w - childrenTotal)/2;
      unit.childUnits.forEach(function(c){
        place(c, childLeft);
        childLeft += c._w;
      });
    }
  }
  var cursor = 0;
  units.forEach(function(u){
    computeWidth(u);
    place(u, cursor);
    cursor += u._w;
  });
  return cursor;
}
function flattenUnits(units, out){
  out = out || [];
  units.forEach(function(u){ out.push(u); flattenUnits(u.childUnits, out); });
  return out;
}

/* ================= Rendering: Tree ================= */
function centerXOf(unit){ return PAD + unit.x * COL_W; } // unit.x is already a center position, in COL_W-sized slot units (see assignX)
function topYOf(unit){ return PAD + unit.gen * ROW_H; }

function renderTree(liveOnly){
  var canvas = document.getElementById("treeCanvas");
  var svg = document.getElementById("treeSvg");
  var empty = document.getElementById("emptyState");

  // liveOnly is used while a card is actively being dragged: redraw the connectors on every
  // frame so they track the card smoothly, without touching the card elements themselves
  // (rebuilding them mid-drag would drop the pointer capture and cancel the drag).
  if(!liveOnly){
    Array.prototype.slice.call(canvas.querySelectorAll(".person-card, .unit-plus, .unit-collapse")).forEach(function(el){ el.remove(); });
  }
  svg.innerHTML = "";

  var personIds = Object.keys(people);
  if(personIds.length === 0){
    empty.hidden = false;
    canvas.style.width = "100%"; canvas.style.height = "100%";
    return;
  }
  empty.hidden = true;

  var childrenMap = buildChildrenMap();
  var gen = computeGenerations();
  var treeData = buildUnits(childrenMap, gen);
  var top = treeData.top;
  var crossLinks = treeData.crossLinks;
  var leafCount = assignX(top);
  var allUnits = flattenUnits(top);
  var maxGen = 0;
  allUnits.forEach(function(u){ maxGen = Math.max(maxGen, u.gen); });

  // assign each separate top-level branch its own color -- everything hanging off the single
  // biggest branch (the "main" line) keeps the plain neutral styling; every other branch
  // (a disconnected lineage, or an in-law line pulled in via a dashed cross-link) gets a
  // distinct color from the bright palette, falling back to the muted set once it's used up.
  var branchColorOf = {};
  (function(){
    if(top.length <= 1) return;
    var sizes = top.map(function(u){ return flattenUnits([u]).length; });
    var mainIdx = 0;
    for(var bi = 1; bi < sizes.length; bi++){ if(sizes[bi] > sizes[mainIdx]) mainIdx = bi; }
    var palette = BRANCH_COLORS.concat(BRANCH_COLORS_FALLBACK);
    var cursor = 0;
    top.forEach(function(rootUnit, idx){
      var color = null;
      if(idx !== mainIdx){ color = palette[cursor % palette.length]; cursor++; }
      flattenUnits([rootUnit]).forEach(function(u){ branchColorOf[u.key] = color; });
    });
  })();

  // ---- pass 1: compute each unit's effective (drag-adjusted) position ----
  var effPos = {};
  var maxX = 0, maxY = 0;
  allUnits.forEach(function(unit){
    var cx = centerXOf(unit), topY = topYOf(unit);
    var ep;
    if(unit.members.length === 2){
      var o0 = getOffset(unit.members[0]), o1 = getOffset(unit.members[1]);
      var x0 = Math.max(4, cx - CARD_W - SPOUSE_GAP/2 + o0.dx), y0 = Math.max(4, topY + o0.dy);
      var x1 = Math.max(4, cx + SPOUSE_GAP/2 + o1.dx), y1 = Math.max(4, topY + o1.dy);
      // The trunk to this couple's children (and any incoming parent/cross-link) anchors to
      // members[0] specifically -- the blood relative this branch is actually built from --
      // rather than an average of both cards. unit.members[1] only ever got here by marriage
      // (see buildUnit), so anchoring to members[0]'s own actual position means the connector
      // always touches a real, currently-drawn card: it correctly follows when that person is
      // dragged, and never goes stray into the gap when their partner is dragged elsewhere instead.
      ep = { x0:x0, y0:y0, x1:x1, y1:y1, cx: x0 + CARD_W/2, topY: y0 };
      maxX = Math.max(maxX, x0 + CARD_W, x1 + CARD_W); maxY = Math.max(maxY, y0 + CARD_H, y1 + CARD_H, topY + CARD_H);
    } else {
      var o = getOffset(unit.members[0]);
      var sx = Math.max(4, cx - CARD_W/2 + o.dx), sy = Math.max(4, topY + o.dy);
      ep = { x0: sx, y0: sy, cx: sx + CARD_W/2, topY: sy };
      maxX = Math.max(maxX, sx + CARD_W); maxY = Math.max(maxY, sy + CARD_H);
    }
    effPos[unit.key] = ep;
  });

  var width = Math.max(leafCount * COL_W + PAD*2, maxX + PAD, 600);
  var height = Math.max((maxGen+1) * ROW_H + PAD*2, maxY + PAD);
  canvas.style.width = width + "px";
  canvas.style.height = height + "px";
  canvas.style.transform = "scale(" + zoom + ")";
  canvas.style.transformOrigin = "0 0";
  svg.setAttribute("width", width);
  svg.setAttribute("height", height);
  svg.setAttribute("viewBox", "0 0 " + width + " " + height);

  var svgNS = "http://www.w3.org/2000/svg";
  // A small "rings" mark straddling the midpoint of a partner connector -- the one visual
  // cue that reads the same regardless of branch color or how zoomed-out the tree is, so a
  // marriage line is never mistaken for a parent-child line at a glance.
  function partnerMark(cx, cy, color){
    var bg = document.createElementNS(svgNS,"rect");
    bg.setAttribute("x", cx-11); bg.setAttribute("y", cy-7.5); bg.setAttribute("width",22); bg.setAttribute("height",15); bg.setAttribute("rx",7.5);
    bg.setAttribute("fill","var(--surface)");
    svg.appendChild(bg);
    var r = 4.2, off = 3.3;
    [-off, off].forEach(function(dx){
      var c = document.createElementNS(svgNS,"circle");
      c.setAttribute("cx", cx+dx); c.setAttribute("cy", cy); c.setAttribute("r", r);
      c.setAttribute("fill","none"); c.setAttribute("stroke", color || "var(--accent)"); c.setAttribute("stroke-width","1.8");
      svg.appendChild(c);
    });
  }
  // A small downward arrowhead at a parent-child connector's child end -- both of this curve's
  // control points share the endpoint's x, so its tangent there is always a straight vertical
  // drop, which is what makes a plain triangle (no path-angle math needed) line up exactly.
  function downArrow(x, y, color){
    var p = document.createElementNS(svgNS,"polygon");
    p.setAttribute("points", (x-5)+","+(y-8)+" "+(x+5)+","+(y-8)+" "+x+","+y);
    p.setAttribute("fill", color || "var(--line-strong)");
    svg.appendChild(p);
  }
  function line(x1,y1,x2,y2,color){
    var l = document.createElementNS(svgNS,"line");
    l.setAttribute("x1",x1); l.setAttribute("y1",y1); l.setAttribute("x2",x2); l.setAttribute("y2",y2);
    l.setAttribute("stroke", color || "var(--line-strong)"); l.setAttribute("stroke-width", color ? "3" : "2.5");
    svg.appendChild(l);
    partnerMark((x1+x2)/2, (y1+y2)/2, color);
  }
  function crossLine(x1,y1,x2,y2,color){
    var midY = (y1 + y2) / 2;
    var p = document.createElementNS(svgNS,"path");
    p.setAttribute("d","M"+x1+","+y1+" C "+x1+","+midY+" "+x2+","+midY+" "+x2+","+y2);
    p.setAttribute("fill","none");
    p.setAttribute("stroke", color || "var(--accent)");
    p.setAttribute("stroke-width", color ? "3" : "2.5");
    p.setAttribute("stroke-dasharray","4 5");
    p.setAttribute("opacity","0.85");
    svg.appendChild(p);
    downArrow(x2, y2, color || "var(--accent)");
  }
  // an organic parent-to-child curve, drawn directly between the two cards' own anchor points --
  // since it never relies on a shared bus line or a fixed column, it stays attached to both
  // ends however far either one is dragged.
  function familyCurve(x1,y1,x2,y2,color){
    var bend = Math.max(24, Math.min(90, Math.abs(y2-y1) * 0.6));
    var p = document.createElementNS(svgNS,"path");
    p.setAttribute("d","M"+x1+","+y1+" C "+x1+","+(y1+bend)+" "+x2+","+(y2-bend)+" "+x2+","+y2);
    p.setAttribute("fill","none");
    p.setAttribute("stroke", color || "var(--line-strong)");
    p.setAttribute("stroke-width", color ? "3" : "2.5");
    svg.appendChild(p);
    downArrow(x2, y2, color);
  }

  // ---- pass 2: draw connectors and cards from the effective positions ----
  var cardPos = {};

  allUnits.forEach(function(unit){
    var ep = effPos[unit.key];

    var bcolor = branchColorOf[unit.key];

    if(unit.members.length === 2){
      // marriage connector: edge-to-edge between the two cards' own midlines, so it still reads correctly if either was dragged
      line(ep.x0 + CARD_W, ep.y0 + CARD_H/2, ep.x1, ep.y1 + CARD_H/2, bcolor);
      if(!liveOnly){
        placeCard(canvas, unit.members[0], ep.x0, ep.y0);
        placeCard(canvas, unit.members[1], ep.x1, ep.y1);
      }
      cardPos[unit.members[0].id] = { x:ep.x0, y:ep.y0 };
      cardPos[unit.members[1].id] = { x:ep.x1, y:ep.y1 };
    } else {
      if(!liveOnly){ placeCard(canvas, unit.members[0], ep.x0, ep.y0); }
      cardPos[unit.members[0].id] = { x:ep.x0, y:ep.y0 };
    }

    // add-relative buttons for this unit (parent + child)
    if(!liveOnly){ placeUnitControls(canvas, unit, ep); }

    // children connectors: one organic curve per child, straight from this card to that card,
    // so each stays visibly attached to both ends no matter how either is dragged
    unit.childUnits.forEach(function(cu){
      var cep = effPos[cu.key];
      familyCurve(ep.cx, ep.topY + CARD_H, cep.cx, cep.topY, bcolor);
    });
  });

  // cross-links: connect a parent unit down to a child who already married into, and is drawn in, another branch
  crossLinks.forEach(function(cl){
    var childPos = cardPos[cl.childId];
    if(!childPos) return;
    var pep = effPos[cl.parentUnit.key];
    var startX = pep.cx, startY = pep.topY + CARD_H;
    var endX = childPos.x + CARD_W/2, endY = childPos.y;
    crossLine(startX, startY, endX, endY, branchColorOf[cl.parentUnit.key]);
  });

  // trace: thicken the connectors along the path between two searched people
  function traceLine(x1,y1,x2,y2,curved){
    var el;
    if(curved){
      var midY = (y1+y2)/2;
      el = document.createElementNS(svgNS,"path");
      el.setAttribute("d","M"+x1+","+y1+" C "+x1+","+midY+" "+x2+","+midY+" "+x2+","+y2);
      el.setAttribute("fill","none");
    } else {
      el = document.createElementNS(svgNS,"line");
      el.setAttribute("x1",x1); el.setAttribute("y1",y1); el.setAttribute("x2",x2); el.setAttribute("y2",y2);
    }
    el.setAttribute("stroke","var(--trace)");
    el.setAttribute("stroke-width","5.5");
    el.setAttribute("stroke-linecap","round");
    el.setAttribute("opacity","0.95");
    svg.appendChild(el);
  }
  if(highlightPath && highlightPath.length > 1){
    for(var hi = 1; hi < highlightPath.length; hi++){
      var fromId = highlightPath[hi-1], toId = highlightPath[hi];
      var fp = cardPos[fromId], tp = cardPos[toId];
      if(!fp || !tp) continue;
      var rel = relationLabel(fromId, toId);
      if(rel === "partner"){
        traceLine(fp.x + CARD_W/2, fp.y + CARD_H/2, tp.x + CARD_W/2, tp.y + CARD_H/2, false);
      } else {
        var parentPos = (rel === "parent") ? tp : fp;
        var childPos2 = (rel === "parent") ? fp : tp;
        traceLine(parentPos.x + CARD_W/2, parentPos.y + CARD_H, childPos2.x + CARD_W/2, childPos2.y, true);
      }
    }
    [highlightPath[0], highlightPath[highlightPath.length-1]].forEach(function(pid){
      var el = canvas.querySelector('.person-card[data-id="'+pid+'"]');
      if(el) el.classList.add("trace-endpoint");
    });
  }
}

function placeCard(canvas, person, x, y){
  var card = document.createElement("div");
  card.className = "person-card";
  card.style.left = x + "px";
  card.style.top = y + "px";
  card.dataset.id = person.id;
  card.tabIndex = 0;
  card.setAttribute("role","button");
  card.setAttribute("aria-label","Open " + fullName(person));

  var avatarHtml;
  if(person.photo){
    avatarHtml = '<div class="avatar" style="background-image:url(\'' + person.photo + '\')"></div>';
  } else {
    avatarHtml = '<div class="avatar" style="background:' + avatarColor(person.id) + ';color:' + avatarInk(person.id) + '">' + escapeHtml(initials(person)) + '</div>';
  }

  var maidenHtml = person.maidenName ? ' <span class="p-maiden">née ' + escapeHtml(person.maidenName) + '</span>' : '';
  var datesHtml = displayDates(person) ? '<div class="p-dates">' + escapeHtml(displayDates(person)) + '</div>' : '';
  var detailsHtml = person.details ? '<div class="p-details">' + escapeHtml(person.details) + '</div>' : '';

  card.innerHTML =
    avatarHtml +
    '<button type="button" class="p-btn textwrap">' +
      '<div class="p-name">' + escapeHtml(fullName(person)) + maidenHtml + '</div>' +
      datesHtml + detailsHtml +
    '</button>';

  // --- dragging: grab anywhere on the card except the avatar, to reposition it freely ---
  card.style.touchAction = "none";
  var drag = null;
  card.addEventListener("pointerdown", function(e){
    if(e.target.closest(".avatar")) return;
    if(e.button !== undefined && e.button !== 0) return;
    drag = { startX:e.clientX, startY:e.clientY, moved:false };
    try{ card.setPointerCapture(e.pointerId); }catch(err){}
  });
  card.addEventListener("pointermove", function(e){
    if(!drag) return;
    var dx = (e.clientX - drag.startX) / zoom;
    var dy = (e.clientY - drag.startY) / zoom;
    if(!drag.moved && (Math.abs(dx) > 3 || Math.abs(dy) > 3)){
      drag.moved = true;
      card.style.zIndex = "5";
    }
    if(drag.moved){
      card.style.transform = "translate(" + dx + "px," + dy + "px)";
      liveDragOverride = { personId: person.id, dx: dx, dy: dy };
      if(!dragRafPending){
        dragRafPending = true;
        requestAnimationFrame(function(){
          dragRafPending = false;
          if(drag && drag.moved) renderTree(true);
        });
      }
    }
  });
  function endDrag(e){
    if(!drag) return;
    var startX = drag.startX, startY = drag.startY, moved = drag.moved;
    drag = null;
    liveDragOverride = null;
    if(!moved) return; // a plain click: leave the DOM alone so the upcoming "click" event still fires and opens the edit modal
    var dx = (e.clientX - startX) / zoom;
    var dy = (e.clientY - startY) / zoom;
    var prev = person.posOffset || { dx:0, dy:0 };
    person.posOffset = { dx: prev.dx + dx, dy: prev.dy + dy };
    isExample = false; showingLocalPlaceholder = false;
    saveState();
    suppressNextClick = true;
    renderTree();
  }
  card.addEventListener("pointerup", endDrag);
  card.addEventListener("pointercancel", function(){
    drag = null;
    liveDragOverride = null;
    card.style.transform = "";
    card.style.zIndex = "";
    renderTree(true);
  });

  card.addEventListener("click", function(e){
    if(suppressNextClick){ suppressNextClick = false; return; }
    if(e.target.closest(".avatar")) return;
    openEdit(person.id);
  });
  card.addEventListener("keydown", function(e){
    if(e.key === "Enter" || e.key === " "){ e.preventDefault(); openEdit(person.id); }
  });
  canvas.appendChild(card);
}

function placeUnitControls(canvas, unit, ep){
  var cx = ep.cx, topY = ep.topY;
  // "add partner" shown only for single-member units, to the right of the card
  if(unit.members.length === 1){
    var addPartner = document.createElement("button");
    addPartner.className = "unit-plus";
    addPartner.title = "Add partner";
    addPartner.textContent = "+";
    addPartner.style.left = (ep.x0 + CARD_W + 6) + "px";
    addPartner.style.top = (ep.y0 + CARD_H/2 - 11) + "px";
    addPartner.addEventListener("click", function(ev){
      ev.stopPropagation();
      startRelationship("partner", unit.members[0].id);
    });
    canvas.appendChild(addPartner);
  }
  // "add parent" shown above EACH member who doesn't yet have parents recorded,
  // so a partner's own side of the family can branch upward too, independent of the main line
  unit.members.forEach(function(member, idx){
    var hasParents = (member.parentIds||[]).some(function(pid){ return people[pid]; });
    if(hasParents) return;
    var memberCx, memberTopY;
    if(unit.members.length === 2){
      memberCx = (idx === 0) ? (ep.x0 + CARD_W/2) : (ep.x1 + CARD_W/2);
      memberTopY = (idx === 0) ? ep.y0 : ep.y1;
    } else {
      memberCx = ep.x0 + CARD_W/2;
      memberTopY = ep.y0;
    }
    var addParent = document.createElement("button");
    addParent.className = "unit-plus";
    addParent.title = "Add parent for " + fullName(member);
    addParent.textContent = "+";
    addParent.style.left = (memberCx - 11) + "px";
    addParent.style.top = (memberTopY - 30) + "px";
    addParent.addEventListener("click", function(ev){
      ev.stopPropagation();
      startRelationship("parent", member.id);
    });
    canvas.appendChild(addParent);
  });
  // "add child" below the unit
  var addChild = document.createElement("button");
  addChild.className = "unit-plus";
  addChild.title = "Add child";
  addChild.textContent = "+";
  addChild.style.left = (cx - 11) + "px";
  addChild.style.top = (topY + CARD_H + 6) + "px";
  addChild.addEventListener("click", function(ev){
    ev.stopPropagation();
    startRelationship("child", unit.members[0].id);
  });
  canvas.appendChild(addChild);

  // collapse / expand toggle, for units that have descendants worth hiding -- sits at the
  // top-right corner of the unit's rightmost card, above the add-parent row so it never overlaps.
  if(unit.hasChildren){
    var rightEdge = unit.members.length === 2 ? ep.x1 + CARD_W : ep.x0 + CARD_W;
    var toggle = document.createElement("button");
    toggle.className = "unit-collapse" + (unit.collapsed ? " is-collapsed" : "");
    toggle.style.left = (rightEdge - (unit.collapsed ? 30 : 20)) + "px";
    toggle.style.top = (topY - 10) + "px";
    if(unit.collapsed){
      toggle.title = "Show " + unit.hiddenCount + " hidden descendant" + (unit.hiddenCount===1 ? "" : "s");
      toggle.textContent = "▸ " + unit.hiddenCount;
    } else {
      toggle.title = "Collapse this branch";
      toggle.textContent = "−";
    }
    toggle.addEventListener("click", function(ev){
      ev.stopPropagation();
      people[unit.key].collapsedChildren = !unit.collapsed;
      saveState();
      renderTree();
    });
    canvas.appendChild(toggle);
  }
}

function renderList(){

function startRelationship(kind, anchorId){
  pendingRelAction = { kind: kind, anchorId: anchorId };
  var fresh = {
    id: uid(), firstName:"", lastName:"", maidenName:"", birthYear:"", deathYear:"",
    details:"", phone:"", email:"", location:"", notes:"", photo:"", partnerId:"", parentIds:[]
  };
  var anchor = people[anchorId];
  if(kind === "child" && anchor){
    fresh.lastName = anchor.lastName || "";
    fresh.parentIds = anchor.partnerId ? [anchor.id, anchor.partnerId] : [anchor.id];
    if(anchor.collapsedChildren) delete anchor.collapsedChildren; // a new child should be visible right away
  }
  if(kind === "sibling" && anchor){
    fresh.lastName = anchor.lastName || "";
    fresh.parentIds = (anchor.parentIds||[]).slice();
  }
  if(kind === "parent" && anchor){
    fresh.lastName = anchor.lastName || "";
  }
  openEdit(null, fresh);
}

function applyPendingRelationship(newId){
  var action = pendingRelAction;
  var anchor = people[action.anchorId];
  var np = people[newId];
  if(!anchor) return;
  if(action.kind === "partner"){
    anchor.partnerId = newId;
    np.partnerId = anchor.id;
  } else if(action.kind === "child"){
    np.parentIds = anchor.partnerId ? [anchor.id, anchor.partnerId] : [anchor.id];
  } else if(action.kind === "sibling"){
    np.parentIds = (anchor.parentIds||[]).slice();
  } else if(action.kind === "parent"){
    // attach as a parent of anchor (and anchor's partner-produced siblings share same parent set)
    var existing = (anchor.parentIds||[]).filter(function(pid){ return people[pid]; });
    if(existing.length >= 2){ toast("This person already has two parents recorded."); return; }
    anchor.parentIds = existing.concat([newId]);
  }
}
// Same relationship actions as applyPendingRelationship, but linking to a person who
// already exists in the tree (picked from the name-match suggestions) instead of a
// freshly created one -- so e.g. a second child's "parent" naturally reuses the SAME
// parent record their sibling already has, rather than creating a same-named duplicate.
// Returns false (and shows a toast) when the link isn't safe to make as-is.
function applyPendingRelationshipToExisting(existingId){
  var action = pendingRelAction;
  if(!action) return true; // plain "Add person" matched an existing name -- nothing to connect, just don't duplicate
  var anchor = people[action.anchorId];
  var existing = people[existingId];
  if(!anchor || !existing) return true;
  if(existingId === action.anchorId){
    toast("That's the same person you're adding a relative for.");
    return false;
  }
  if(action.kind === "partner"){
    if(existing.partnerId && existing.partnerId !== anchor.id){
      toast(fullName(existing) + " already has a different partner recorded.");
      return false;
    }
    if(anchor.partnerId && anchor.partnerId !== existingId){
      toast(fullName(anchor) + " already has a different partner recorded.");
      return false;
    }
    anchor.partnerId = existingId;
    existing.partnerId = anchor.id;
  } else if(action.kind === "child"){
    var wantParents = anchor.partnerId ? [anchor.id, anchor.partnerId] : [anchor.id];
    var curParents = (existing.parentIds||[]).filter(function(pid){ return people[pid]; });
    if(curParents.length && !sameIdSet(curParents, wantParents)){
      toast(fullName(existing) + " already has different parents recorded — edit them directly to relink.");
      return false;
    }
    existing.parentIds = wantParents;
  } else if(action.kind === "sibling"){
    var anchorParents = (anchor.parentIds||[]).filter(function(pid){ return people[pid]; });
    var existingParents = (existing.parentIds||[]).filter(function(pid){ return people[pid]; });
    if(anchorParents.length && existingParents.length && !sameIdSet(anchorParents, existingParents)){
      toast("These two already have different parents recorded — edit them directly to relink.");
      return false;
    }
    if(!existingParents.length && anchorParents.length) existing.parentIds = anchorParents.slice();
    if(!anchorParents.length && existingParents.length) anchor.parentIds = existingParents.slice();
  } else if(action.kind === "parent"){
    var curAnchorParents = (anchor.parentIds||[]).filter(function(pid){ return people[pid]; });
    if(curAnchorParents.indexOf(existingId) !== -1){
      toast(fullName(existing) + " is already recorded as a parent.");
      return false;
    }
    if(curAnchorParents.length >= 2){
      toast("This person already has two parents recorded.");
      return false;
    }
    anchor.parentIds = curAnchorParents.concat([existingId]);
  }
  isExample = false; showingLocalPlaceholder = false;
  saveState();
  return true;
}

function countDescendants(id){
  var map = buildChildrenMap();
  var seen = {};
  function walk(pid){
    (map[pid]||[]).forEach(function(cid){
      if(!seen[cid]){ seen[cid] = true; walk(cid); }
    });
  }
  walk(id);
  return Object.keys(seen).length;
}

function deletePerson(id){
  var person = people[id];
  if(!person) return;
  if(person.photo && isOwnStorageUrl(person.photo)) deletePhotoFromStorage(person.photo);
  if(person.partnerId && people[person.partnerId]){
    people[person.partnerId].partnerId = "";
  }
  Object.keys(people).forEach(function(pid){
    var pr = people[pid];
    if(pr.parentIds && pr.parentIds.indexOf(id) !== -1){
      pr.parentIds = pr.parentIds.filter(function(x){ return x !== id; });
    }
  });
  delete people[id];
  pendingDbDeletes.push(id);
  isExample = false; showingLocalPlaceholder = false;
  saveState();
  renderAll();
  toast("Removed from the tree.");
}

/* ================= Image resize ================= */
function resizeImage(file, maxSize, quality){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var w = img.width, h = img.height;
        var scale = Math.min(1, maxSize / Math.max(w,h));
        w = Math.max(1, Math.round(w*scale));
        h = Math.max(1, Math.round(h*scale));
        var canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        var ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        try{ resolve(canvas.toDataURL("image/jpeg", quality)); }
        catch(err){ reject(err); }
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ================= Photo storage (Supabase Storage bucket) ================= */
// When connected to Supabase, photos are uploaded to a Storage bucket instead of
// being embedded as base64 in the database row (base64 counts heavily against the
// much smaller database-storage quota). Inside the Claude artifact, or whenever
// Supabase isn't connected, photos just stay as base64 data URLs like before --
// uploadPhotoToStorage() below falls back to that automatically.

function dataUrlToBlob(dataUrl){
  var parts = dataUrl.split(",");
  var mime = (parts[0].match(/data:([^;]+)/) || [null,"image/jpeg"])[1];
  var binary = atob(parts[1]);
  var bytes = new Uint8Array(binary.length);
  for(var i=0; i<binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new Blob([bytes], { type: mime });
}

// True only for a public URL this app itself generated from PHOTO_BUCKET -- used so
// we never try to "clean up" something that was never ours (e.g. a base64 data URL,
// or a photo the Claude-artifact/db path stored some other way).
function isOwnStorageUrl(url){
  if(!url || !SUPABASE_URL) return false;
  var prefix = SUPABASE_URL.replace(/\/$/, "") + "/storage/v1/object/public/" + PHOTO_BUCKET + "/";
  return url.indexOf(prefix) === 0;
}

// Uploads a resized-photo data URL to Supabase Storage and resolves with the public
// URL to store on the person instead. If Supabase isn't connected, or the upload
// fails for any reason, resolves with the original data URL unchanged so the photo
// still saves (just embedded, as before) rather than being lost.
function uploadPhotoToStorage(dataUrl, personId){
  if(!supaClient) return Promise.resolve(dataUrl);
  var blob;
  try{ blob = dataUrlToBlob(dataUrl); }
  catch(e){ return Promise.resolve(dataUrl); }
  var path = personId + "/" + Date.now() + ".jpg";
  return supaClient.storage.from(PHOTO_BUCKET).upload(path, blob, { contentType: "image/jpeg", upsert: true })
    .then(function(res){
      if(res && res.error) return dataUrl;
      var pub = supaClient.storage.from(PHOTO_BUCKET).getPublicUrl(path);
      var url = pub && pub.data && pub.data.publicUrl;
      return url || dataUrl;
    }, function(){ return dataUrl; });
}

// Best-effort delete of a photo's storage object (when replacing or removing a
// photo, or deleting the person). Never blocks the UI and never reports failure --
// an orphaned file in the bucket costs a little space, not correctness.
function deletePhotoFromStorage(url){
  if(!supaClient || !isOwnStorageUrl(url)) return;
  var prefix = SUPABASE_URL.replace(/\/$/, "") + "/storage/v1/object/public/" + PHOTO_BUCKET + "/";
  var path = url.slice(prefix.length);
  supaClient.storage.from(PHOTO_BUCKET).remove([path]).catch(function(){});
}

/* ================= Import / Export (clipboard-based; downloads are blocked) ================= */
function exportJSON(){
  var data = JSON.stringify({ people: people }, null, 2);
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(data).then(function(){
      toast("Tree data copied — paste it anywhere to save a backup.");
    }).catch(function(){ showImportExportFallback(data); });
  } else {
    showImportExportFallback(data);
  }
}
function showImportExportFallback(prefill){
  var overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.id = "importOverlay";
  overlay.innerHTML =
    '<div class="modal"><div class="modal-head"><h2>Tree data</h2>' +
      '<button class="modal-close" id="ieClose">' +
        '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>' +
      '</button></div>' +
    '<div class="modal-body">' +
      '<div class="field"><label>' + (prefill ? "Copy this to save a backup" : "Paste tree data to import") + '</label>' +
      '<textarea id="ieText">' + escapeHtml(prefill||"") + '</textarea></div>' +
    '</div>' +
    '<div class="modal-foot">' +
      (prefill ? '' : '<button class="btn primary" id="ieImport">Import</button>') +
      '<button class="btn ghost" id="ieCancel">Close</button>' +
    '</div></div>';
  document.body.appendChild(overlay);
  overlay.querySelector("#ieClose").addEventListener("click", function(){ overlay.remove(); });
  overlay.querySelector("#ieCancel").addEventListener("click", function(){ overlay.remove(); });
  overlay.addEventListener("click", function(e){ if(e.target===overlay) overlay.remove(); });
  var importBtn = overlay.querySelector("#ieImport");
  if(importBtn){
    importBtn.addEventListener("click", function(){
      try{
        var parsed = JSON.parse(overlay.querySelector("#ieText").value);
        var newPeople = parsed.people || parsed;
        if(!newPeople || typeof newPeople !== "object") throw new Error("bad shape");
        pendingDbDeletes = pendingDbDeletes.concat(Object.keys(people));
        people = newPeople;
        isExample = false; showingLocalPlaceholder = false;
        saveState();
        renderAll();
        overlay.remove();
        toast("Tree imported.");
      }catch(err){
        toast("That didn't look like valid tree data.");
      }
    });
  }
}
function importJSON(){
  if(navigator.clipboard && navigator.clipboard.readText){
    navigator.clipboard.readText().then(function(text){
      try{
        var parsed = JSON.parse(text);
        var newPeople = parsed.people || parsed;
        if(!newPeople || typeof newPeople !== "object") throw new Error("bad");
        pendingDbDeletes = pendingDbDeletes.concat(Object.keys(people));
        people = newPeople;
        isExample = false; showingLocalPlaceholder = false;
        saveState();
        renderAll();
        toast("Tree imported from clipboard.");
      }catch(e){
        showImportExportFallback("");
      }
    }).catch(function(){ showImportExportFallback(""); });
  } else {
    showImportExportFallback("");
  }
}

/* ================= More menu ================= */
function toggleMoreMenu(){
  var existing = document.getElementById("moreMenu");
  if(existing){ existing.remove(); return; }
  var btn = document.getElementById("moreBtn");
  var rect = btn.getBoundingClientRect();
  var menu = document.createElement("div");
  menu.id = "moreMenu";
  menu.style.cssText = "position:fixed;z-index:60;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;box-shadow:var(--shadow);padding:6px;min-width:190px;right:"+(window.innerWidth-rect.right)+"px;top:"+(rect.bottom+6)+"px;display:flex;flex-direction:column;";
  function item(label){
    var b = document.createElement("button");
    b.textContent = label;
    b.style.cssText = "all:unset;cursor:pointer;padding:8px 10px;border-radius:7px;font-size:13px;color:var(--ink);";
    b.addEventListener("mouseenter", function(){ b.style.background = "var(--accent-soft)"; });
    b.addEventListener("mouseleave", function(){ b.style.background = "transparent"; });
    return b;
  }
  var resetItem = item("Reset card positions");
  resetItem.addEventListener("click", function(){
    menu.remove();
    Object.keys(people).forEach(function(id){ delete people[id].posOffset; });
    saveState();
    renderAll();
    toast("Cards snapped back to the automatic layout.");
  });
  var expandItem = item("Expand all collapsed branches");
  expandItem.addEventListener("click", function(){
    menu.remove();
    var any = false;
    Object.keys(people).forEach(function(id){ if(people[id].collapsedChildren){ delete people[id].collapsedChildren; any = true; } });
    saveState();
    renderAll();
    toast(any ? "All branches expanded." : "Nothing was collapsed.");
  });
  var copyItem = item("Copy tree data (backup)");
  copyItem.addEventListener("click", function(){ menu.remove(); exportJSON(); });
  var importItem = item("Import tree data…");
  importItem.addEventListener("click", function(){ menu.remove(); importJSON(); });
  var excelItem = item("Export to Excel (.xlsx)");
  excelItem.addEventListener("click", function(){ menu.remove(); exportExcel(); });
  menu.appendChild(resetItem);
  menu.appendChild(expandItem);
  menu.appendChild(copyItem);
  menu.appendChild(importItem);
  menu.appendChild(excelItem);
  document.body.appendChild(menu);
  setTimeout(function(){
    document.addEventListener("click", function h(e){
      if(!menu.contains(e.target) && e.target !== btn){ menu.remove(); document.removeEventListener("click", h); }
    });
  },0);
}

/* ================= View switching / zoom ================= */
function setView(v){
  currentView = v;
  document.getElementById("tabTree").setAttribute("aria-pressed", v==="tree");
  document.getElementById("tabList").setAttribute("aria-pressed", v==="list");
  document.getElementById("treeScroll").style.display = v==="tree" ? "block" : "none";
  document.querySelector(".zoomctl").style.display = v==="tree" ? "flex" : "none";
  document.getElementById("listView").style.display = v==="list" ? "block" : "none";
  if(v==="list") renderList();
}
function setZoom(z){
  zoom = Math.max(0.4, Math.min(1.6, z));
  var canvas = document.getElementById("treeCanvas");
  canvas.style.transform = "scale(" + zoom + ")";
  canvas.style.transformOrigin = "0 0";
  document.getElementById("zoomReset").textContent = Math.round(zoom*100) + "%";
}
// Same as setZoom, but keeps the canvas point under (clientX, clientY) fixed on screen --
// used by wheel-zoom and pinch-zoom so the view zooms toward the cursor / the pinch
// midpoint instead of toward the top-left corner.
function setZoomAtPoint(newZoom, clientX, clientY){
  var scroller = document.getElementById("treeScroll");
  var canvas = document.getElementById("treeCanvas");
  if(!scroller || !canvas) return;
  newZoom = Math.max(0.4, Math.min(1.6, newZoom));
  if(newZoom === zoom) return;
  var rect = scroller.getBoundingClientRect();
  var px = clientX - rect.left;
  var py = clientY - rect.top;
  var canvasX = (scroller.scrollLeft + px) / zoom;
  var canvasY = (scroller.scrollTop + py) / zoom;
  zoom = newZoom;
  canvas.style.transform = "scale(" + zoom + ")";
  canvas.style.transformOrigin = "0 0";
  document.getElementById("zoomReset").textContent = Math.round(zoom*100) + "%";
  scroller.scrollLeft = canvasX * zoom - px;
  scroller.scrollTop = canvasY * zoom - py;
}
// Horizontally centers the tree and scrolls to the very top, so the earliest generation
// (the root ancestors) is always the thing you land on -- called on first load, after adding
// a new oldest-generation ancestor, and from the "center tree" button for whenever the view
// has drifted off while adding people lower down or to the side.
function centerTreeView(smooth){
  var scroller = document.getElementById("treeScroll");
  var canvas = document.getElementById("treeCanvas");
  if(!scroller || !canvas) return;
  var canvasW = canvas.offsetWidth * zoom;
  var left = Math.max(0, (canvasW - scroller.clientWidth) / 2);
  scroller.scrollTo({ left: left, top: 0, behavior: smooth ? "smooth" : "auto" });
}

/* ================= Canvas pan & zoom ================= */
// Click-hold-drag (or tap-hold-drag on touch) to pan around the tree, mouse-wheel
// to zoom in/out toward the cursor, and two-finger pinch to zoom on touch devices --
// all driven by Pointer Events so mouse, touch and pen share one code path.
(function(){
  var scroller = document.getElementById("treeScroll");
  if(!scroller) return;
  scroller.style.touchAction = "none"; // we drive panning & pinch-zoom ourselves instead of the browser
  var pointers = {};   // pointerId -> {x,y}
  var panBase = null;  // one-finger / mouse drag baseline
  var pinchBase = null; // two-finger pinch baseline

  function ignoreTarget(target){
    return !!(target.closest && target.closest(".person-card, .unit-plus, .unit-collapse, .zoomctl, button, input, textarea, select, a, label"));
  }
  function pointerList(){ return Object.keys(pointers).map(function(k){ return pointers[k]; }); }
  function dist(a, b){ return Math.hypot(a.x - b.x, a.y - b.y); }

  function startPan(x, y){
    panBase = { x: x, y: y, scrollLeft: scroller.scrollLeft, scrollTop: scroller.scrollTop };
    pinchBase = null;
  }
  function startPinch(){
    var pts = pointerList();
    if(pts.length < 2) return;
    pinchBase = { dist: dist(pts[0], pts[1]), zoom: zoom };
    panBase = null;
  }

  scroller.addEventListener("pointerdown", function(e){
    if(currentView !== "tree") return;
    if(ignoreTarget(e.target)) return;
    if(e.button !== undefined && e.button > 0) return; // primary mouse button, touch or pen only
    pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
    try{ scroller.setPointerCapture(e.pointerId); }catch(err){}
    scroller.classList.add("panning");
    var count = Object.keys(pointers).length;
    if(count === 1) startPan(e.clientX, e.clientY);
    else if(count === 2) startPinch();
  });

  scroller.addEventListener("pointermove", function(e){
    if(!pointers[e.pointerId]) return;
    pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
    var pts = pointerList();
    if(pts.length >= 2 && pinchBase){
      var newDist = dist(pts[0], pts[1]);
      var midX = (pts[0].x + pts[1].x) / 2;
      var midY = (pts[0].y + pts[1].y) / 2;
      if(newDist > 0) setZoomAtPoint(pinchBase.zoom * (newDist / pinchBase.dist), midX, midY);
    } else if(pts.length === 1 && panBase){
      scroller.scrollLeft = panBase.scrollLeft + (panBase.x - e.clientX);
      scroller.scrollTop = panBase.scrollTop + (panBase.y - e.clientY);
    }
  });

  function endPointer(e){
    delete pointers[e.pointerId];
    try{ scroller.releasePointerCapture(e.pointerId); }catch(err){}
    var pts = pointerList();
    if(pts.length === 0){
      panBase = null; pinchBase = null;
      scroller.classList.remove("panning");
    } else if(pts.length === 1){
      startPan(pts[0].x, pts[0].y); // dropped from a pinch to one finger -- keep panning, no jump
    } else {
      startPinch();
    }
  }
  scroller.addEventListener("pointerup", endPointer);
  scroller.addEventListener("pointercancel", endPointer);

  scroller.addEventListener("wheel", function(e){
    if(currentView !== "tree") return;
    e.preventDefault();
    setZoomAtPoint(zoom * Math.exp(-e.deltaY * 0.0015), e.clientX, e.clientY);
  }, { passive: false });
})();

})();
